# Met le site en ligne sur GitHub Pages à chaque envoi sur la branche main.
# À activer une seule fois : Settings > Pages > Source : « GitHub Actions ».
name: Mise en ligne

on:
  push:
    branches: [main]
  # Permet aussi de lancer la mise en ligne à la main, depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule mise en ligne à la fois ; celle en cours va jusqu'au bout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Tests et construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # Donne le chemin du site : "/nom-du-depot", ou vide avec un nom de domaine.
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Mise en ligne
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
