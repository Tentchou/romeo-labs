# Vérifie le code à chaque envoi sur la branche main : lint, tests et construction.
# La mise en ligne, elle, est faite par Cloudflare Pages, qui suit ce dépôt.
name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, tests et construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
